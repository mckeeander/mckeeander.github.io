<!doctype html>
<html lang="en" class="root-home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} · Data Science Projects</title>
<meta name="description" content="{{role}}: data science projects with the reasoning, code and results.">
<meta property="og:title" content="{{name}} · Data Science Projects">
<meta property="og:description" content="{{role}}: data science projects with the reasoning, code and results.">
<meta name="theme-color" content="#2340ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script>
  // Back/forward: let the browser's own gesture animate; skip the page fade.
  addEventListener("pagereveal", (e) => {
    if (!e.viewTransition) return;
    const t = window.navigation && navigation.activation && navigation.activation.navigationType;
    const nav = performance.getEntriesByType("navigation")[0];
    if (t === "traverse" || (!t && nav && nav.type === "back_forward")) e.viewTransition.skipTransition();
  });
</script>
</head>
<body class="home">
<header class="poster">
  <div class="wrap">
    <div class="poster-row"><span>{{role}}</span><span>Portfolio</span></div>
    <h1 class="poster-name" aria-label="{{name}}">{{name_lines}}</h1>
    <div class="poster-split">
      <div class="bio">{{bio}}</div>
      <nav class="links" aria-label="Elsewhere">{{links}}</nav>
    </div>
  </div>
</header>

<main class="band">
  <div class="wrap board">
    {{education}}
    <section class="cell-work" aria-labelledby="projects-h">
      <h2 id="projects-h" class="kicker">Projects</h2>
      <div class="entries">{{cards}}</div>
    </section>
  </div>
</main>
<footer class="foot"><div class="wrap">{{credits}}</div></footer>
<script src="assets/site.js" defer></script>
</body>
</html>
