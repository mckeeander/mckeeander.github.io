<!doctype html>
<html lang="en" class="root-project">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_name}}</title>
<meta name="description" content="{{summary}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{summary}}">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
{{head_extra}}
<script>
  // Back/forward: let the browser's own gesture animate; skip the page fade.
  addEventListener("pagereveal", (e) => {
    if (!e.viewTransition) return;
    const t = window.navigation && navigation.activation && navigation.activation.navigationType;
    const nav = performance.getEntriesByType("navigation")[0];
    if (t === "traverse" || (!t && nav && nav.type === "back_forward")) e.viewTransition.skipTransition();
  });
</script>
</head>
<body class="project">
<div class="topbar">
  <div class="wrap topbar-in">
    <a class="back" href="../../"><span aria-hidden="true">&larr;</span> All projects</a>
    <a class="topbar-name" href="../../">{{site_name}}</a>
  </div>
  <div class="progress" aria-hidden="true"><span></span></div>
</div>

<header class="proj-poster">
  <div class="wrap">
    <div class="poster-row"><span class="proj-tags">{{tags}}</span><span class="meta"><span>{{date}}</span><span>{{language}}</span></span></div>
    <h1>{{title}}</h1>
    <div class="proj-split">
      <p class="lede">{{summary}}</p>
      {{stat}}
    </div>
  </div>
</header>

<div class="proj-layout wrap {{toc_class}}">
  <nav class="toc" aria-label="On this page"><p>On this page</p>{{toc}}</nav>
  <article class="proj-body">
{{body}}
  </article>
</div>

<footer class="foot"><div class="wrap"><a class="back" href="../../"><span aria-hidden="true">&larr;</span> All projects</a><div class="foot-credits">{{credits}}</div></div></footer>
<script src="../../assets/site.js" defer></script>
{{scripts}}
</body>
</html>
