<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_name}}</title>
<meta name="description" content="{{summary}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{summary}}">
<meta name="theme-color" content="#121419">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
{{head_extra}}
<script>
  // Back/forward: let the browser's own gesture animate; skip the page fade.
  addEventListener("pagereveal", (e) => {
    if (!e.viewTransition) return;
    const t = window.navigation && navigation.activation && navigation.activation.navigationType;
    const nav = performance.getEntriesByType("navigation")[0];
    if (t === "traverse" || (!t && nav && nav.type === "back_forward")) e.viewTransition.skipTransition();
  });
</script>
</head>
<body class="project">
<div class="topbar">
  <a class="back" href="../../"><span aria-hidden="true">&larr;</span> All projects</a>
  <div class="progress" aria-hidden="true"><span></span></div>
</div>

<header class="proj-hero wrap">
  <div class="card-tags">{{tags}}</div>
  <h1>{{title}}</h1>
  <p class="lede">{{summary}}</p>
  <p class="meta"><span>{{date}}</span><span>{{language}}</span></p>
</header>

<div class="proj-layout wrap {{toc_class}}">
  <nav class="toc" aria-label="On this page"><p>On this page</p>{{toc}}</nav>
  <article class="proj-body">
{{body}}
  </article>
</div>

<footer class="foot wrap"><a class="back" href="../../"><span aria-hidden="true">&larr;</span> All projects</a><div class="foot-credits">{{credits}}</div></footer>
<script src="../../assets/site.js" defer></script>
{{scripts}}
</body>
</html>
