<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_name}}</title>
<meta name="description" content="{{summary}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{summary}}">
<meta name="theme-color" content="#121419">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
{{head_extra}}
</head>
<body class="project">
<div class="glow" aria-hidden="true"></div>
<div class="topbar">
  <a class="back" href="../../"><span aria-hidden="true">&larr;</span> All projects</a>
  <div class="progress" aria-hidden="true"><span></span></div>
</div>

<header class="proj-hero wrap" style="view-transition-name: card-{{slug}}">
  <div class="card-tags">{{tags}}</div>
  <h1 style="view-transition-name: title-{{slug}}">{{title}}</h1>
  <p class="lede">{{summary}}</p>
  <p class="meta"><span>{{date}}</span><span>{{language}}</span></p>
</header>

<div class="proj-layout wrap {{toc_class}}">
  <nav class="toc" aria-label="On this page"><p>On this page</p>{{toc}}</nav>
  <article class="proj-body">
{{body}}
  </article>
</div>

<footer class="foot wrap"><a class="back" href="../../"><span aria-hidden="true">&larr;</span> All projects</a></footer>
<script src="../../assets/site.js" defer></script>
{{scripts}}
</body>
</html>
